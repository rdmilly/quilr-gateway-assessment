[project]
name = "quilr-gateway-assessment"
version = "0.1.0"
description = "MCP server, MCP security gateway, streaming PII guardrail and rate-limited model router, built for the QuilrAI Solution Architect assessment."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Ryan Milly" }]
dependencies = [
    "mcp==2.3.0",
    "fastapi>=0.150,<0.163",
    "uvicorn>=0.50,<0.55",
    "httpx2==2.16.0",
    "pydantic>=2.11,<3",
    "regex",
    "aiosqlite==0.22.1",
    "pyjwt==2.15.1",
]

[project.scripts]
task1-mcp-server = "task1_mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "hypothesis",
    "pytest-cov==7.1.0",
    "ruff",
    "mypy",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "task1_mcp_server", "task2_mcp_gateway"]

[tool.uv]
# Supply-chain cooldown: never resolve a package version published in the last week.
exclude-newer = "2026-10-31T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S: security (Bandit's rules). ASYNC: blocking calls inside async code. BLE: catch-all
# excepts, the classic way a guard fails open. DTZ: timezone-naive datetimes.
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC", "BLE", "DTZ", "PT", "RUF", "PGH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["shared", "task1_mcp_server", "task2_mcp_gateway", "mocks", "tests"]
explicit_package_bases = true

[tool.coverage.run]
branch = true
source = ["shared", "task1_mcp_server", "task2_mcp_gateway"]
# Measure the servers that tests start as separate processes, too.
patch = ["subprocess"]
# Servers stopped with SIGTERM still save their coverage data.
sigterm = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.importlinter]
root_packages = ["shared", "task1_mcp_server", "task2_mcp_gateway", "mocks"]

[[tool.importlinter.contracts]]
name = "Tasks never import each other"
type = "independence"
modules = ["task1_mcp_server", "task2_mcp_gateway"]

[[tool.importlinter.contracts]]
name = "The shared kit imports no task and no mock"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["task1_mcp_server", "task2_mcp_gateway", "mocks"]

[[tool.importlinter.contracts]]
name = "Product code never imports the mocks"
type = "forbidden"
source_modules = ["task1_mcp_server", "task2_mcp_gateway"]
forbidden_modules = ["mocks"]
