# Example settings for running the assessment locally. Copy to config.toml to use.
#
# The tokens are fake test values, and only their SHA-256 hashes are stored here:
#   test-admin-token   -> subject "alice",  role admin
#   test-viewer-token  -> subject "victor", role viewer
# To add a token:  uv run python -c "from shared.auth import hash_token; print(hash_token('...'))"

[auth]
tokens = [
    { sha256 = "17d6bfe05d1b1fb7bc499f8e3f639c7b3eda4c40f321eef8887a0c04c89a99c5", subject = "alice", role = "admin" },
    { sha256 = "04afacc947b28c94e15578a9db68c1d1bf775b3ff82bc88e31d4465f26bc0b42", subject = "victor", role = "viewer" },
]

# Optional: also accept signed JWTs. Each must be signed with HS256 by the secret in the
# environment variable below, issued by `issuer`, for `audience` (this gateway), unexpired,
# with `sub` and a `role` claim of "admin" or "viewer". Uncomment to turn on.
# [auth.jwt]
# issuer = "https://idp.example"
# audience = "mcp-gateway"
# secret_env = "GATEWAY_JWT_SECRET"

[mcp_gateway]
downstream_url = "http://127.0.0.1:9000/mcp"   # the one server the gateway forwards to
max_body_bytes = 1048576
upstream_timeout_s = 30
allowed_origins = []                            # browser Origins allowed; agents send none
host = "127.0.0.1"
port = 8080

[llm_gateway]
provider_url = "http://127.0.0.1:9100/v1/chat/completions"   # the mock provider by default
# provider_api_key_env = "PROVIDER_API_KEY"                  # env var with the provider's key
upstream_timeout_s = 60
host = "127.0.0.1"
port = 8081

[llm_router]
primary_url = "http://127.0.0.1:9100/v1/chat/completions"   # mock provider "primary"
backup_url = "http://127.0.0.1:9101/v1/chat/completions"    # mock provider "backup"
# primary_api_key_env = "PRIMARY_API_KEY"                    # env vars holding provider keys
# backup_api_key_env = "BACKUP_API_KEY"
failover_timeout_ms = 3000      # primary must answer (first chunk, for streams) within this
failover_on_errors = false      # true: also fail over on 5xx and connection errors
stream_idle_timeout_s = 60      # cut a stream that has started and then goes silent
tokens_per_window = 50000       # per tenant (the token's subject)
window_s = 60
db_path = "data/rate_limits.sqlite3"
default_max_tokens = 1024       # assumed completion size when a request sets no max_tokens
host = "127.0.0.1"
port = 8082
